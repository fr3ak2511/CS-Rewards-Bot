name: Reward regression tests

on:
  push:
    branches:
      - prod
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'event_closeout.py'
      - 'event_rewards.py'
      - 'event_rewards_config.json'
      - 'master_claimer.py'
      - 'promotion_followups.py'
      - 'recovery_policy.py'
      - '.github/scripts/recovery_policy.js'
      - '.github/scripts/primary_dispatch_policy.js'
      - 'progression_claim_safety.py'
      - 'reward_popup_guard.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/event-tests.yml'
      - '.github/workflows/schedule.yml'
      - '.github/workflows/recovery.yml'

  pull_request:
    branches:
      - prod
      - dev
    paths:
      - 'event_closeout.py'
      - 'event_rewards.py'
      - 'event_rewards_config.json'
      - 'master_claimer.py'
      - 'promotion_followups.py'
      - 'recovery_policy.py'
      - '.github/scripts/recovery_policy.js'
      - '.github/scripts/primary_dispatch_policy.js'
      - 'progression_claim_safety.py'
      - 'reward_popup_guard.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/event-tests.yml'
      - '.github/workflows/schedule.yml'
      - '.github/workflows/recovery.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  reward-regression-tests:
    name: Reward regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js for scheduler and immediate-recovery policy tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scheduler and immediate-recovery decision tests
        run: node --test tests/test_primary_dispatch_policy.js tests/test_recovery_policy.js
