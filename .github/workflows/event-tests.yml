
name: Halloween and reward regression tests

on:
  push:
    branches:
      - fix/halloween-popup-guard
      - feature/halloween-event-rewards
      - release/halloween-2026-production
    paths:
      - 'event_rewards.py'
      - 'event_rewards_config.json'
      - 'master_claimer.py'
      - 'progression_claim_safety.py'
      - 'reward_popup_guard.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/event-tests.yml'

  pull_request:
    branches:
      - feature/halloween-event-rewards
    paths:
      - 'event_rewards.py'
      - 'event_rewards_config.json'
      - 'master_claimer.py'
      - 'progression_claim_safety.py'
      - 'reward_popup_guard.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/event-tests.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  reward-regression-tests:
    name: Halloween and reward regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v
