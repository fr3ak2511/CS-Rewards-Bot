name: CS Hub Immediate Failed-ID Recovery

on:
  workflow_run:
    workflows: ["CS Hub Rewards Claimer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  recover-failed-ids:
    name: Dispatch recovery for unresolved eligible claims
    if: (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify the completed full-roster cycle and inspect retry candidates
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = context.payload.workflow_run;
            const out = (dispatch, reason) => {
              core.setOutput('dispatch', dispatch ? 'true' : 'false');
              core.info(`${dispatch ? 'RECOVERY NEEDED' : 'NO RECOVERY'}: ${reason}`);
            };

            // Ignore lightweight/no-op runs where the Python claim step never executed.
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: source.id, per_page: 100
            });
            const claimJob = (jobsResponse.data.jobs || []).find(job => job.name === 'Run Master Claimer');
            if (!claimJob || claimJob.status !== 'completed') {
              out(false, 'no completed claim job found');
              return;
            }
            const claimStep = (claimJob.steps || []).find(step => step.name === 'Run Master Claimer');
            if (!claimStep || !['success', 'failure'].includes(claimStep.conclusion)) {
              out(false, 'the actual Master Claimer step did not execute');
              return;
            }

            const fileResponse = await github.rest.repos.getContent({
              owner, repo, path: 'bot_meta.json', ref: 'main'
            });
            if (Array.isArray(fileResponse.data) || !fileResponse.data.content) {
              out(false, 'bot_meta.json was not readable after the run');
              return;
            }
            const meta = JSON.parse(Buffer.from(fileResponse.data.content, 'base64').toString('utf8'));
            const last = meta.last_run || {};
            const candidateSource = Array.isArray(last.retry_player_ids) ? last.retry_player_ids : last.failed_player_ids;
            const retryIds = Array.isArray(candidateSource)
              ? [...new Set(candidateSource.map(x => String(x).trim()).filter(Boolean))]
              : [];

            const stamp = String(last.timestamp || '');
            const lastEpoch = stamp
              ? Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(stamp) ? stamp : `${stamp}+05:30`)
              : NaN;
            const sourceEpoch = Date.parse(source.updated_at || source.run_started_at || source.created_at);
            const sameRun = Number.isFinite(lastEpoch) && Number.isFinite(sourceEpoch)
              && Math.abs(sourceEpoch - lastEpoch) <= 15 * 60 * 1000;

            const durationSeconds = Math.max(0, Number(last.duration_seconds) || 0);
            const runStartEpoch = Number.isFinite(lastEpoch) ? lastEpoch - durationSeconds * 1000 : NaN;
            const nowIstDate = new Date(Date.now() + 330 * 60 * 1000);
            const year = nowIstDate.getUTCFullYear();
            const month = nowIstDate.getUTCMonth();
            const day = nowIstDate.getUTCDate();
            const pad = n => String(n).padStart(2, '0');
            const nowIst = `${year}-${pad(month + 1)}-${pad(day)}T${pad(nowIstDate.getUTCHours())}:${pad(nowIstDate.getUTCMinutes())}:${pad(nowIstDate.getUTCSeconds())}`;
            let resetDate = `${year}-${pad(month + 1)}-${pad(day)}`;
            if (nowIst.slice(11, 19) < '05:30:00') {
              const previous = new Date(Date.UTC(year, month, day) - 24 * 60 * 60 * 1000);
              resetDate = `${previous.getUTCFullYear()}-${pad(previous.getUTCMonth() + 1)}-${pad(previous.getUTCDate())}`;
            }
            const resetEpoch = Date.parse(`${resetDate}T05:30:00+05:30`);
            const ageMs = Date.now() - lastEpoch;
            const validLabel = ['Primary Run', 'Manual Run', 'Promotional Check #1', 'Promotional Check #2', 'Promotional Check #3', 'Promotional Check #4', 'Backup Run #1', 'Backup Run #2', 'Backup Run #3', 'Backup Run #4'].includes(last.run_label);
            const validWindow = Number.isFinite(lastEpoch) && lastEpoch >= resetEpoch && lastEpoch <= Date.now()
              && Number.isFinite(runStartEpoch) && runStartEpoch >= resetEpoch
              && Number.isFinite(ageMs) && ageMs >= 0 && ageMs <= 4 * 60 * 60 * 1000;

            if (!validLabel || !sameRun || !validWindow) {
              out(false, 'saved result is stale, does not match this workflow, or the run began before the 05:30 IST reset');
              return;
            }
            if (!retryIds.length) {
              out(false, 'no hard failures or incomplete eligible claims were recorded');
              return;
            }

            // One dispatch per completed scheduled source run. The receiving workflow
            // re-checks bot_meta.json after acquiring its concurrency slot; Recovery Run
            // labels cannot trigger another workflow_run recovery loop.
            core.setOutput('retry_count', String(retryIds.length));
            out(true, `${retryIds.length} unresolved eligible player ID(s); dispatch one bounded recovery pass`);

      - name: Dispatch the main workflow in failed-ID recovery mode
        if: steps.decision.outputs.dispatch == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'claim-recovery',
              client_payload: {
                source_run_id: context.payload.workflow_run.id,
                retry_count: Number('${{ steps.decision.outputs.retry_count }}')
              }
            });
            core.info('Recovery dispatched; the receiver revalidates freshness and retry candidates before starting the browser.')
