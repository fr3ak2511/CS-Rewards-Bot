name: CS Hub Immediate Recovery Dispatcher

on:
  workflow_run:
    workflows: ["CS Hub Rewards Claimer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Primary Run ID to service its deferred Progression queue"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  dispatch-immediate-recovery:
    name: Dispatch serialized post-Primary recovery pass
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'prod') || (github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the production policy code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify the completed full-roster cycle and inspect retry candidates
        id: decision
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const out = (dispatch, reason) => {
              core.setOutput('dispatch', dispatch ? 'true' : 'false');
              core.info(`${dispatch ? 'RECOVERY NEEDED' : 'NO RECOVERY'}: ${reason}`);
            };

            let source;
            if (context.eventName === 'workflow_dispatch') {
              const sourceRunId = String(context.payload.inputs?.source_run_id || '').trim();
              if (!/^\d+$/.test(sourceRunId)) {
                out(false, 'manual catch-up requires one numeric completed Primary Run ID');
                return;
              }
              try {
                const response = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: Number(sourceRunId)
                });
                source = response.data;
              } catch (error) {
                out(false, `source run ${sourceRunId} could not be fetched; no dispatch performed`);
                return;
              }
              if (source.name !== 'CS Hub Rewards Claimer'
                  || source.status !== 'completed'
                  || source.head_branch !== 'prod'
                  || !['schedule', 'workflow_dispatch'].includes(source.event)) {
                out(false, 'manual source must be a completed CS Hub Rewards Claimer Primary candidate from prod; no dispatch performed');
                return;
              }
            } else {
              source = context.payload.workflow_run;
            }

            // Ignore lightweight/no-op runs where the Python claim step never executed.
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: source.id, per_page: 100
            });
            const claimJob = (jobsResponse.data.jobs || []).find(job => job.name === 'Run Master Claimer');
            if (!claimJob || claimJob.status !== 'completed') {
              out(false, 'no completed claim job found');
              return;
            }
            const claimStep = (claimJob.steps || []).find(step => step.name === 'Run Master Claimer');
            if (!claimStep || !['success', 'failure'].includes(claimStep.conclusion)) {
              out(false, 'the actual Master Claimer step did not execute');
              return;
            }

            const fileResponse = await github.rest.repos.getContent({
              owner, repo, path: 'bot_meta.json', ref: 'runtime-state'
            });
            if (Array.isArray(fileResponse.data) || !fileResponse.data.content) {
              out(false, 'bot_meta.json was not readable from runtime-state after the run');
              return;
            }
            const meta = JSON.parse(Buffer.from(fileResponse.data.content, 'base64').toString('utf8'));
            const last = meta.last_run || {};
            const path = require('path');
            const policyPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'scripts', 'recovery_policy.js');
            const rosterResponse = await github.rest.repos.getContent({
              owner, repo, path: 'players.csv', ref: 'prod'
            });
            if (Array.isArray(rosterResponse.data) || !rosterResponse.data.content) {
              out(false, 'players.csv was not readable from prod; refusing immediate recovery');
              return;
            }
            const rosterText = Buffer.from(rosterResponse.data.content, 'base64').toString('utf8');
            const playerIds = rosterText.split(/\r?\n/).slice(1)
              .map(line => line.split(',')[0].trim())
              .filter(Boolean);
            if (!playerIds.length || new Set(playerIds).size !== playerIds.length) {
              out(false, 'configured production roster is empty or contains duplicate IDs');
              return;
            }

            const { evaluateImmediateRecovery, evaluateImmediateProgressionQueueRecovery } = require(policyPath);
            const nowEpochMs = Date.now();
            const failedDecision = evaluateImmediateRecovery({
              lastRun: last,
              sourceRun: source,
              nowEpochMs
            });
            const progressionDecision = evaluateImmediateProgressionQueueRecovery({
              lastRun: last,
              meta,
              sourceRun: source,
              playerIds,
              nowEpochMs
            });

            const dispatch = failedDecision.dispatch || progressionDecision.dispatch;
            core.setOutput('failed_dispatch', failedDecision.dispatch ? 'true' : 'false');
            core.setOutput('progression_queue_only', progressionDecision.dispatch ? 'true' : 'false');
            core.setOutput('retry_count', String(failedDecision.retryIds.length));
            core.setOutput('progression_count', String(progressionDecision.progressionIds.length));

            const reasons = [];
            if (failedDecision.dispatch) reasons.push(failedDecision.reason);
            if (progressionDecision.dispatch) reasons.push(progressionDecision.reason);
            if (!reasons.length) {
              reasons.push(`failed-ID lane: ${failedDecision.reason}`);
              reasons.push(`Progression lane: ${progressionDecision.reason}`);
            }
            out(dispatch, reasons.join('; '));

      - name: Dispatch one serialized post-Primary recovery pass
        if: steps.decision.outputs.dispatch == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'claim-recovery',
              client_payload: {
                source_run_id: source.id,
                retry_count: Number('${{ steps.decision.outputs.retry_count }}'),
                progression_queue_only: '${{ steps.decision.outputs.progression_queue_only }}' === 'true'
              }
            });
            core.info('One serialized recovery dispatch requested. The receiver revalidates failed targets and source-matched Progression queue entries after acquiring the shared claim lock.')

      - name: Report immediate recovery decision
        if: always()
        env:
          DISPATCH_DECISION: ${{ steps.decision.outputs.dispatch }}
          FAILED_DISPATCH: ${{ steps.decision.outputs.failed_dispatch }}
          PROGRESSION_DISPATCH: ${{ steps.decision.outputs.progression_queue_only }}
          RETRY_COUNT: ${{ steps.decision.outputs.retry_count }}
          PROGRESSION_COUNT: ${{ steps.decision.outputs.progression_count }}
        run: |
          {
            echo "## Immediate post-Primary recovery decision"
            if [[ "$DISPATCH_DECISION" == "true" ]]; then
              echo "- **Serialized dispatch:** requested"
              echo "- **Failed-ID targets:** $RETRY_COUNT (enabled: $FAILED_DISPATCH)"
              echo "- **Deferred Progression accounts:** $PROGRESSION_COUNT (enabled: $PROGRESSION_DISPATCH)"
              echo "- The receiver revalidates both scopes after acquiring the shared claim lock."
            else
              echo "- **Dispatch:** not performed"
              echo "- This is a successful policy no-op, not evidence that a reward was claimed."
              echo "- See the decision step log for the exact reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
