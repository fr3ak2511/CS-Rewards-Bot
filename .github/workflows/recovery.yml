name: CS Hub Immediate Failed-ID Recovery

on:
  workflow_run:
    workflows: ["CS Hub Rewards Claimer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  recover-failed-ids:
    name: Dispatch recovery for unresolved eligible claims
    if: (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the production policy code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify the completed full-roster cycle and inspect retry candidates
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = context.payload.workflow_run;
            const out = (dispatch, reason) => {
              core.setOutput('dispatch', dispatch ? 'true' : 'false');
              core.info(`${dispatch ? 'RECOVERY NEEDED' : 'NO RECOVERY'}: ${reason}`);
            };

            // Ignore lightweight/no-op runs where the Python claim step never executed.
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: source.id, per_page: 100
            });
            const claimJob = (jobsResponse.data.jobs || []).find(job => job.name === 'Run Master Claimer');
            if (!claimJob || claimJob.status !== 'completed') {
              out(false, 'no completed claim job found');
              return;
            }
            const claimStep = (claimJob.steps || []).find(step => step.name === 'Run Master Claimer');
            if (!claimStep || !['success', 'failure'].includes(claimStep.conclusion)) {
              out(false, 'the actual Master Claimer step did not execute');
              return;
            }

            const fileResponse = await github.rest.repos.getContent({
              owner, repo, path: 'bot_meta.json', ref: source.head_branch
            });
            if (Array.isArray(fileResponse.data) || !fileResponse.data.content) {
              out(false, 'bot_meta.json was not readable after the run');
              return;
            }
            const meta = JSON.parse(Buffer.from(fileResponse.data.content, 'base64').toString('utf8'));
            const last = meta.last_run || {};
            const path = require('path');
            const policyPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'scripts', 'recovery_policy.js');
            const { evaluateImmediateRecovery } = require(policyPath);
            const decision = evaluateImmediateRecovery({
              lastRun: last,
              sourceRun: source,
              nowEpochMs: Date.now()
            });

            if (!decision.dispatch) {
              out(false, decision.reason);
              return;
            }

            // One dispatch per completed scheduled source run. The receiving workflow
            // re-checks bot_meta.json after acquiring its concurrency slot; Recovery Run
            // labels cannot trigger another workflow_run recovery loop.
            core.setOutput('retry_count', String(decision.retryIds.length));
            out(true, decision.reason);

      - name: Dispatch the main workflow in failed-ID recovery mode
        if: steps.decision.outputs.dispatch == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'claim-recovery',
              client_payload: {
                source_run_id: context.payload.workflow_run.id,
                retry_count: Number('${{ steps.decision.outputs.retry_count }}')
              }
            });
            core.info('Recovery dispatched; the receiver revalidates freshness and retry candidates before starting the browser.')

      - name: Report immediate recovery decision
        if: always()
        env:
          DISPATCH_DECISION: ${{ steps.decision.outputs.dispatch }}
        run: |
          {
            echo "## Immediate recovery decision"
            if [[ "$DISPATCH_DECISION" == "true" ]]; then
              echo "- **Dispatch:** requested"
              echo "- The receiving claimer revalidates saved account targets before opening a browser."
            else
              echo "- **Dispatch:** not performed"
              echo "- This is a successful policy no-op, not evidence that the reward was claimed."
              echo "- See the decision step log for the exact reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
