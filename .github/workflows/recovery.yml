name: CS Hub Immediate Failed-ID Recovery

on:
  workflow_run:
    workflows: ["CS Hub Rewards Claimer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  recover-failed-ids:
    name: Dispatch recovery when a scheduled full run recorded failures
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify a real post-reset claim run and inspect failed IDs
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = context.payload.workflow_run;
            const out = (dispatch, reason) => {
              core.setOutput('dispatch', dispatch ? 'true' : 'false');
              core.info(`${dispatch ? 'RECOVERY NEEDED' : 'NO RECOVERY'}: ${reason}`);
            };

            // Ignore no-op gate checks, the 03:00 waiting job by itself, and any
            // workflow run where the actual Python claim step did not execute.
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: source.id,
              per_page: 100
            });
            const claimJob = (jobsResponse.data.jobs || []).find(job => job.name === 'Run Master Claimer');
            if (!claimJob || claimJob.status !== 'completed') {
              out(false, 'no completed Master Claimer job found');
              return;
            }
            const claimStep = (claimJob.steps || []).find(step => step.name === 'Run Master Claimer');
            if (!claimStep || !['success', 'failure'].includes(claimStep.conclusion)) {
              out(false, 'the actual Master Claimer step did not execute');
              return;
            }

            // Read persisted state only after the main workflow's state-commit step.
            const fileResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'bot_meta.json',
              ref: 'main'
            });
            if (Array.isArray(fileResponse.data) || !fileResponse.data.content) {
              out(false, 'bot_meta.json was not readable');
              return;
            }
            const meta = JSON.parse(Buffer.from(fileResponse.data.content, 'base64').toString('utf8'));
            const last = meta.last_run || {};
            const failedIds = Array.isArray(last.failed_player_ids)
              ? [...new Set(last.failed_player_ids.map(x => String(x).trim()).filter(Boolean))]
              : [];

            // Confirm this saved record corresponds to the workflow that just ended.
            const stamp = String(last.timestamp || '');
            const lastEpoch = stamp
              ? Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(stamp) ? stamp : `${stamp}+05:30`)
              : NaN;
            const sourceEpoch = Date.parse(source.updated_at || source.run_started_at || source.created_at);
            const sameRun = Number.isFinite(lastEpoch) && Number.isFinite(sourceEpoch)
              && Math.abs(sourceEpoch - lastEpoch) <= 15 * 60 * 1000;

            const durationSeconds = Math.max(0, Number(last.duration_seconds) || 0);
            const runStartEpoch = Number.isFinite(lastEpoch)
              ? lastEpoch - durationSeconds * 1000
              : NaN;

            const nowIstDate = new Date(Date.now() + 330 * 60 * 1000);
            const year = nowIstDate.getUTCFullYear();
            const month = nowIstDate.getUTCMonth();
            const day = nowIstDate.getUTCDate();
            const pad = n => String(n).padStart(2, '0');
            const nowIstText = `${year}-${pad(month + 1)}-${pad(day)}T${pad(nowIstDate.getUTCHours())}:${pad(nowIstDate.getUTCMinutes())}:${pad(nowIstDate.getUTCSeconds())}`;
            let resetDate = `${year}-${pad(month + 1)}-${pad(day)}`;
            if (nowIstText.slice(11, 19) < '05:30:00') {
              const previous = new Date(Date.UTC(year, month, day) - 24 * 60 * 60 * 1000);
              resetDate = `${previous.getUTCFullYear()}-${pad(previous.getUTCMonth() + 1)}-${pad(previous.getUTCDate())}`;
            }
            const resetEpoch = Date.parse(`${resetDate}T05:30:00+05:30`);
            const sinceReset = Number.isFinite(lastEpoch)
              && lastEpoch >= resetEpoch
              && lastEpoch <= Date.now();
            const startedAfterReset = Number.isFinite(runStartEpoch) && runStartEpoch >= resetEpoch;
            const ageMs = Date.now() - lastEpoch;
            const recent = Number.isFinite(ageMs) && ageMs >= 0 && ageMs <= 4 * 60 * 60 * 1000;

            if (last.run_label !== 'Primary Run') {
              out(false, `latest saved run is '${last.run_label || 'unknown'}', not a scheduled full-roster run`);
              return;
            }
            if (!sameRun || !sinceReset || !startedAfterReset || !recent) {
              out(false, 'saved result is stale, does not match this workflow, or the claim cycle started before the daily reset');
              return;
            }
            if (failedIds.length === 0) {
              out(false, 'no hard-failed player IDs were recorded');
              return;
            }

            core.setOutput('failed_count', String(failedIds.length));
            out(true, `${failedIds.length} hard-failed player ID(s) recorded; dispatch one immediate failed-ID-only recovery`);

      - name: Dispatch the main workflow in failed-ID recovery mode
        if: steps.decision.outputs.dispatch == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'claim-recovery',
              client_payload: {
                source_run_id: context.payload.workflow_run.id,
                failed_count: Number('${{ steps.decision.outputs.failed_count }}')
              }
            });
            core.info('Dispatched claim-recovery. The main workflow will re-check bot_meta.json after acquiring the claim-job concurrency slot.');
