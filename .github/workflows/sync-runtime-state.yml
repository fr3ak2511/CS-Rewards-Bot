name: Sync production runtime state to fix branch

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type SYNC_RUNTIME_STATE to copy the two runtime files to the fix branch"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-runtime-state:
    name: Copy latest production runtime state to fix branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Use the same concurrency key as the production claimer's Run Master Claimer job.
    # This prevents a state-copy operation from racing a live claim/recovery job.
    concurrency:
      group: rewards-claimer
      cancel-in-progress: false
    steps:
      - name: Validate explicit confirmation and selected branch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "SYNC_RUNTIME_STATE" ]]; then
            echo "Refusing to run: confirmation must be exactly SYNC_RUNTIME_STATE."
            exit 2
          fi
          if [[ "$SELECTED_BRANCH" != "fix/halloween-popup-guard" ]]; then
            echo "Refusing to run: select fix/halloween-popup-guard in the Run workflow branch dropdown."
            exit 2
          fi
          echo "Confirmed: only the fix branch will be updated."

      - name: Check out selected fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/halloween-popup-guard
          fetch-depth: 0
          persist-credentials: true

      - name: Copy and validate the two latest runtime files from production
        env:
          SOURCE_BRANCH: feature/halloween-event-rewards
          TARGET_BRANCH: fix/halloween-popup-guard
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

          SOURCE_SHA="$(git rev-parse "origin/$SOURCE_BRANCH")"
          TARGET_SHA_BEFORE="$(git rev-parse HEAD)"
          echo "Production source commit: $SOURCE_SHA"
          echo "Fix branch before sync: $TARGET_SHA_BEFORE"

          mkdir -p .runtime-state-sync-tmp
          git show "origin/$SOURCE_BRANCH:claim_history.json" > .runtime-state-sync-tmp/claim_history.json
          git show "origin/$SOURCE_BRANCH:bot_meta.json" > .runtime-state-sync-tmp/bot_meta.json

          python - <<'PY'
          import json
          from pathlib import Path

          history_path = Path('.runtime-state-sync-tmp/claim_history.json')
          meta_path = Path('.runtime-state-sync-tmp/bot_meta.json')
          history = json.loads(history_path.read_text(encoding='utf-8-sig'))
          meta = json.loads(meta_path.read_text(encoding='utf-8-sig'))

          if not isinstance(history, dict) or not isinstance(meta, dict):
              raise SystemExit('Runtime state validation failed: expected JSON objects.')

          last_run = meta.get('last_run') or {}
          if not isinstance(last_run, dict):
              raise SystemExit('Runtime state validation failed: bot_meta.last_run is not an object.')

          print(f'Validated claim_history.json: {len(history)} account records.')
          print(f"Validated bot_meta.json: last run label={last_run.get('run_label', 'unknown')!r}, timestamp={last_run.get('timestamp', 'missing')!r}.")
          print('No player IDs or account-level contents will be printed.')
          PY

          install -m 0644 .runtime-state-sync-tmp/claim_history.json claim_history.json
          install -m 0644 .runtime-state-sync-tmp/bot_meta.json bot_meta.json
          rm -rf .runtime-state-sync-tmp

          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('claim_history.json', 'bot_meta.json'):
              json.loads(Path(name).read_text(encoding='utf-8-sig'))
              print(f'Post-copy JSON validation passed: {name}')
          PY

          git add -- claim_history.json bot_meta.json
          if git diff --cached --quiet; then
            echo "The fix branch already contains the latest production runtime files; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: refresh runtime state from production [skip ci]"

          # Reconcile against the latest target tip without force-pushing.
          git fetch origin "$TARGET_BRANCH"
          if ! git rebase "origin/$TARGET_BRANCH"; then
            echo "Could not safely rebase the runtime-state commit. No force push will be attempted."
            git rebase --abort || true
            exit 1
          fi
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Runtime state sync completed. Only claim_history.json and bot_meta.json were changed."
