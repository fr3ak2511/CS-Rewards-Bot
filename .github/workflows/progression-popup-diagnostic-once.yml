name: One-time Promotional Popup Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm this full-roster popup diagnostic cannot claim rewards or write runtime state"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  popup-diagnostic:
    name: Read-only promotional popup verification
    if: github.ref == 'refs/heads/prod' && inputs.confirm_read_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    concurrency:
      group: rewards-claimer
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out production source
        uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert production and read-only scope
        env:
          SELECTED_BRANCH: ${{ github.ref_name }}
          CONFIRM_READ_ONLY: ${{ inputs.confirm_read_only }}
        run: |
          if [[ "$SELECTED_BRANCH" != "prod" ]]; then
            echo "This diagnostic can only run against prod."
            exit 2
          fi
          if [[ "$CONFIRM_READ_ONLY" != "true" ]]; then
            echo "Explicit read-only confirmation is required."
            exit 2
          fi
          echo "Scope: authenticated Progression page; exact known promotional overlay only."
          echo "Unrelated dialogs and unknown overlays are not clicked."
          echo "Reward claims, claim history, Progression queue, and runtime-state writes are disabled."

      - name: Run isolated promotional popup diagnostic
        run: python master_claimer.py --progression-popup-diagnostic-only

      - name: Upload popup diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cs-hub-progression-popup-diagnostic-${{ github.run_id }}
          path: run_artifacts/progression_popup_diagnostic_summary.json
          if-no-files-found: error
          retention-days: 14
