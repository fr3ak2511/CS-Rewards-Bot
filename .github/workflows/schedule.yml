name: CS Hub Rewards Claimer

on:
  schedule:
    # Runs every 3 hours, anchored to 05:35 AM IST
    - cron: '5 0/3 * * *'
  workflow_dispatch:
    inputs:
      diagnose_login:
        description: "Inspect login UI only (no ID submission or reward claims)"
        required: false
        type: boolean
        default: false
      test_login_only:
        description: "Submit the first configured player ID and verify login only (no reward claims)"
        required: false
        type: boolean
        default: false

concurrency:
  group: rewards-claimer

jobs:
  run-claimer:
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRITICAL FIX: Ensures the streak state saves successfully
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Upgraded to v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5 # Upgraded to v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Claimer
        env:
          # RESTORED: Your EXACT working secrets from the morning backup
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USERNAME: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SENDER_EMAIL }}
          SMTP_TO: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Suppresses Node.js deprecation warnings
          LOGIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_login }}
          LOGIN_TEST_ONLY: ${{ inputs.test_login_only }}
        run: |
          if [ "$LOGIN_DIAGNOSTIC_ONLY" = "true" ] && [ "$LOGIN_TEST_ONLY" = "true" ]; then
            echo "Choose only one manual mode: diagnose_login OR test_login_only."
            exit 2
          elif [ "$LOGIN_DIAGNOSTIC_ONLY" = "true" ]; then
            python master_claimer.py --diagnose-login
          elif [ "$LOGIN_TEST_ONLY" = "true" ]; then
            python master_claimer.py --test-login-only
          else
            python master_claimer.py
          fi

      - name: Commit State Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: update claim history and meta [skip ci]"
          file_pattern: "claim_history.json bot_meta.json"

      - name: Upload login diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-login-diagnostics-${{ github.run_id }}
          path: login_diagnostics/
          if-no-files-found: ignore
          retention-days: 3
