name: CS Hub Rewards Claimer

on:
  schedule:
    # Daily launcher starts its waiting job at 03:00 IST (21:30 UTC).
    # The actual claimer is released at a shared, date-seeded target between 05:35 and 06:00 IST.
    - cron: '30 21 * * *'

    # 5-minute fallback checks from 05:30 through 06:00 IST.
    # Checks before the daily randomized target are no-ops.
    - cron: '0-30/5 0 * * *'

    # Full-roster backups every 4 hours during the day, after the reset window:
    # 09:35, 13:35, 17:35, 21:35 IST.
    # The 01:35 IST slot is intentionally omitted so no scheduled claim cycle runs before 05:30.
    - cron: '5 4,8,12,16 * * *'

  repository_dispatch:
    types: [claim-recovery]

  workflow_dispatch:
    inputs:
      diagnose_login:
        description: "Inspect login UI only (no ID submission or reward claims)"
        required: false
        type: boolean
        default: false
      test_login_only:
        description: "Submit the first configured player ID and verify login only (no reward claims)"
        required: false
        type: boolean
        default: false
      test_claims_one_player:
        description: "Run real reward claims for the first configured player only"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Lightweight schedule gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Decide whether this trigger should proceed
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const crypto = require('crypto');
            const launcherCron = '30 21 * * *';
            const retryCron = '0-30/5 0 * * *';
            const backupCron = '5 4,8,12,16 * * *';

            const out = (run, reason) => {
              core.setOutput('should_run', run ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.info(`${run ? 'CONTINUE' : 'SKIP'}: ${reason}`);
            };

            // Manual runs and recovery dispatches are intentional requests.
            if (context.eventName !== 'schedule') {
              out(true, `${context.eventName} request`);
              return;
            }

            const cron = context.payload.schedule || '';
            if (![launcherCron, retryCron, backupCron].includes(cron)) {
              out(false, `unrecognised schedule '${cron}'; fail closed`);
              return;
            }

            // The launcher must be allowed to create its wait job even if another
            // claim cycle is just finishing. Its claim job will re-check state later.
            if (cron === launcherCron) {
              out(true, 'daily primary launcher; randomized wait is handled separately');
              return;
            }

            // All morning retries use the same deterministic pseudo-random target
            // as the launcher, so different workflow runs cannot choose different times.
            if (cron === retryCron) {
              const istNow = new Date(Date.now() + 330 * 60 * 1000);
              const year = istNow.getUTCFullYear();
              const month = istNow.getUTCMonth();
              const day = istNow.getUTCDate();
              const pad = n => String(n).padStart(2, '0');
              const dateKey = `${year}-${pad(month + 1)}-${pad(day)}`;
              const offsetSeconds = parseInt(
                crypto.createHash('sha256').update(dateKey).digest('hex').slice(0, 8), 16
              ) % 1501;
              const targetMs = Date.UTC(year, month, day, 5, 35, 0) + offsetSeconds * 1000;
              if (istNow.getTime() < targetMs) {
                const hh = String(Math.floor((5 * 3600 + 35 * 60 + offsetSeconds) / 3600)).padStart(2, '0');
                const mm = String(Math.floor(((5 * 3600 + 35 * 60 + offsetSeconds) % 3600) / 60)).padStart(2, '0');
                const ss = String(offsetSeconds % 60).padStart(2, '0');
                out(false, `before today's randomized primary target (${hh}:${mm}:${ss} IST)`);
                return;
              }
            }

            // Suppress duplicate claim jobs. A dependent claim job belonging to
            // the 03:00 launcher is not treated as started while its delay job is active.
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: 'main',
              per_page: 100
            });
            const activeRuns = response.data.workflow_runs.filter(run =>
              String(run.id) !== String(context.runId) &&
              run.path === '.github/workflows/schedule.yml' &&
              ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)
            );

            for (const run of activeRuns) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              const jobs = jobsResponse.data.jobs || [];
              const delayJob = jobs.find(job => job.name === 'Wait for randomized primary window');
              const delayActive = delayJob && ['queued', 'in_progress'].includes(delayJob.status);
              const claimJob = jobs.find(job => job.name === 'Run Master Claimer');
              if (claimJob && ['queued', 'in_progress'].includes(claimJob.status)) {
                if (delayActive) {
                  core.info(`Run #${run.run_number} is waiting for the randomized target; it has not started its claim cycle yet.`);
                  continue;
                }
                out(false, `claim job in workflow run #${run.run_number} is already ${claimJob.status}`);
                return;
              }
            }

            out(true, 'no other active claim job; proceed to the state check');

  primary_delay:
    name: Wait for randomized primary window
    needs: preflight
    if: github.event_name == 'schedule' && github.event.schedule == '30 21 * * *' && needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Sleep until today's randomized target (05:35–06:00 IST)
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          from datetime import datetime, timedelta, timezone

          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          date_key = now.strftime('%Y-%m-%d')
          offset_seconds = int(hashlib.sha256(date_key.encode('utf-8')).hexdigest()[:8], 16) % 1501
          target = now.replace(hour=5, minute=35, second=0, microsecond=0) + timedelta(seconds=offset_seconds)

          print(f'Current IST time: {now:%Y-%m-%d %H:%M:%S}')
          print(f'Today\'s shared randomized primary target: {target:%Y-%m-%d %H:%M:%S} IST')
          if now < target:
              delay = (target - now).total_seconds()
              print(f'Sleeping {int(delay)} seconds; the claim script will not start before 05:30 IST.')
              time.sleep(delay)
          else:
              print('The scheduled event arrived after the target; proceeding now (never before the target).')
          PY

  run-claimer:
    name: Run Master Claimer
    needs: [preflight, primary_delay]
    if: >-
      always() &&
      needs.preflight.outputs.should_run == 'true' &&
      (needs.primary_delay.result == 'success' || needs.primary_delay.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    concurrency:
      group: rewards-claimer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Re-check reset coverage and determine run mode
        id: run_mode
        env:
          RUN_EVENT: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_TYPE: ${{ github.event.action }}
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, time as dt_time, timezone

          event = os.environ.get('RUN_EVENT', '')
          cron = os.environ.get('SCHEDULE_CRON', '')
          dispatch_type = os.environ.get('DISPATCH_TYPE', '')
          out_path = os.environ['GITHUB_OUTPUT']

          launcher_cron = '30 21 * * *'
          retry_cron = '0-30/5 0 * * *'
          backup_cron = '5 4,8,12,16 * * *'
          ist_tz = timezone(timedelta(hours=5, minutes=30))

          def emit(execute, recovery, reason):
              with open(out_path, 'a', encoding='utf-8') as f:
                  f.write(f"execute={'true' if execute else 'false'}\n")
                  f.write(f"recovery={'true' if recovery else 'false'}\n")
                  f.write(f'reason={reason}\n')
              print(f"{'RUN' if execute else 'SKIP'}: {reason}")

          def load_json(path, default):
              try:
                  with open(path, 'r', encoding='utf-8-sig') as f:
                      return json.load(f)
              except Exception as exc:
                  print(f'WARN: could not read {path}: {type(exc).__name__}')
                  return default

          def parse_ist(value):
              try:
                  parsed = datetime.fromisoformat(str(value))
                  if parsed.tzinfo is not None:
                      parsed = parsed.astimezone(ist_tz).replace(tzinfo=None)
                  return parsed
              except Exception:
                  return None

          def failure_ids(last):
              ids = last.get('failed_player_ids')
              if not isinstance(ids, list):
                  ids = []
              return list(dict.fromkeys(str(pid).strip() for pid in ids if str(pid).strip()))

          meta = load_json('bot_meta.json', {})
          last = meta.get('last_run') or {}
          last_end = parse_ist(last.get('timestamp'))
          duration_raw = last.get('duration_seconds', 0)
          try:
              duration_seconds = max(0, int(duration_raw or 0))
          except Exception:
              duration_seconds = 0
          last_start = last_end - timedelta(seconds=duration_seconds) if last_end else None

          now = datetime.now(ist_tz).replace(tzinfo=None)
          reset_date = now.date()
          if now.time() < dt_time(5, 30):
              reset_date -= timedelta(days=1)
          reset_at = datetime.combine(reset_date, dt_time(5, 30))

          valid_labels = {'Primary Run', 'Manual Run', 'Morning Recovery'}
          covered_since_reset = bool(
              last_end and last_start and
              last_start >= reset_at and last_end <= now and
              last.get('run_label') in valid_labels and
              duration_seconds > 0
          )
          failed_ids = failure_ids(last)
          try:
              last_age_hours = (now - last_end).total_seconds() / 3600 if last_end else None
          except Exception:
              last_age_hours = None

          def daily_target(day):
              date_key = day.strftime('%Y-%m-%d')
              offset_seconds = int(hashlib.sha256(date_key.encode('utf-8')).hexdigest()[:8], 16) % 1501
              return datetime.combine(day, dt_time(5, 35)) + timedelta(seconds=offset_seconds)

          if event == 'workflow_dispatch':
              emit(True, False, 'manual workflow_dispatch request; run configured manual mode')
              raise SystemExit(0)

          if event == 'repository_dispatch':
              if dispatch_type and dispatch_type != 'claim-recovery':
                  emit(False, False, f'unsupported repository_dispatch type {dispatch_type!r}; fail closed')
                  raise SystemExit(0)
              if last.get('run_label') == 'Primary Run' and failed_ids and last_end and last_start:
                  age_hours = (now - last_end).total_seconds() / 3600
                  if last_start >= reset_at and 0 <= age_hours <= 4:
                      emit(True, True, f'event-driven recovery for {len(failed_ids)} failed ID(s) from the recent post-reset run')
                  else:
                      emit(False, False, 'no eligible post-reset Primary Run failures remain; dispatch is stale')
              else:
                  emit(False, False, 'no eligible Primary Run failures remain; recovery dispatch is stale or already handled')
              raise SystemExit(0)

          if event != 'schedule':
              emit(False, False, 'unsupported event; fail closed')
              raise SystemExit(0)

          if cron not in {launcher_cron, retry_cron, backup_cron}:
              emit(False, False, f'unrecognised schedule expression {cron!r}; fail closed')
              raise SystemExit(0)

          # Validate roster before any scheduled browser work.
          try:
              with open('players.csv', 'r', newline='', encoding='utf-8-sig') as f:
                  player_ids = [
                      (row.get('player_id') or '').strip()
                      for row in csv.DictReader(f)
                      if (row.get('player_id') or '').strip()
                  ]
          except Exception as exc:
              emit(False, False, f'players.csv could not be read ({type(exc).__name__}); fail closed')
              raise SystemExit(0)

          if not player_ids or len(player_ids) != len(set(player_ids)):
              emit(False, False, 'players.csv is empty or contains duplicate IDs; fail closed')
              raise SystemExit(0)

          if cron == launcher_cron:
              if covered_since_reset:
                  emit(False, False, 'a claim cycle already started after today\'s 05:30 reset; delayed primary is no longer needed')
              else:
                  target = daily_target(now.date())
                  if now < target:
                      emit(False, False, f'launcher reached state check before randomized target {target:%H:%M:%S} IST; fail closed')
                  else:
                      emit(True, False, f'first full-roster Primary Run after reset; randomized target was {target:%H:%M:%S} IST')

          elif cron == retry_cron:
              target = daily_target(now.date())
              if now < target:
                  emit(False, False, f'before randomized target {target:%H:%M:%S} IST; no claim before target')
              elif not covered_since_reset:
                  emit(True, False, 'fallback Primary Run: no claim cycle has started after the 05:30 IST reset')
              elif last.get('run_label') == 'Primary Run' and failed_ids and last_age_hours is not None and 0 <= last_age_hours <= 4:
                  emit(True, True, f'safety-net recovery for {len(failed_ids)} failed ID(s) from the recent Primary Run')
              else:
                  emit(False, False, 'post-reset claim cycle already ran with no eligible hard-failed IDs; wait for next full-roster backup')

          elif cron == backup_cron:
              # Backups always run the full configured roster. The claimer's live portal
              # checks and claim history prevent repeats for rewards already claimed/on cooldown.
              emit(True, False, f'scheduled 4-hour full-roster backup for {len(player_ids)} IDs')
          PY

      - name: Set up Python
        if: steps.run_mode.outputs.execute == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned dependencies
        if: steps.run_mode.outputs.execute == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Claimer
        if: steps.run_mode.outputs.execute == 'true'
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USERNAME: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SENDER_EMAIL }}
          SMTP_TO: ${{ secrets.RECIPIENT_EMAIL }}
          LOGIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_login }}
          LOGIN_TEST_ONLY: ${{ inputs.test_login_only }}
          CLAIM_TEST_ONLY: ${{ inputs.test_claims_one_player }}
          RECOVERY_ONLY_FAILED: ${{ steps.run_mode.outputs.recovery }}
        run: |
          if { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$LOGIN_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_TEST_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; }; then
            echo "Choose only one manual mode: diagnose_login, test_login_only, OR test_claims_one_player."
            exit 2
          elif [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]]; then
            python master_claimer.py --diagnose-login
          elif [[ "$LOGIN_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-login-only
          elif [[ "$CLAIM_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-claims-one-player
          else
            python master_claimer.py
          fi

      - name: Commit runtime state
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: update claim history and meta [skip ci]"
          file_pattern: "claim_history.json bot_meta.json"

      - name: Upload full-run report and summary
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-run-report-${{ github.run_id }}
          path: |
            debug_email.html
            run_artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload login diagnostics
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-login-diagnostics-${{ github.run_id }}
          path: login_diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload one-player claim test evidence
        if: always() && steps.run_mode.outputs.execute == 'true' && inputs.test_claims_one_player
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-claim-test-${{ github.run_id }}
          path: claim_test_artifacts/
          if-no-files-found: warn
          retention-days: 14
