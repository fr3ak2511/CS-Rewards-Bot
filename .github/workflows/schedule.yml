name: CS Hub Rewards Claimer

on:
  schedule:
    # Dispatcher starts at 03:00 IST and sleeps until a shared randomized target between 05:35 and 06:00 IST.
    - cron: '30 21 * * *'

    # Five-minute reset-window fallbacks; these do nothing before the same randomized target.
    - cron: '0-30/5 0 * * *'

    # Four hourly promotional-check slots: 09:35, 13:35, 17:35 and 21:35 IST.
    # Uncovered/new IDs still receive the full claim path at the next backup.
    - cron: '5 4 * * *'
    - cron: '5 8 * * *'
    - cron: '5 12 * * *'
    - cron: '5 16 * * *'

  repository_dispatch:
    types: [claim-recovery]

  workflow_dispatch:
    inputs:
      diagnose_login:
        description: "Inspect login UI only (no ID submission or reward claims)"
        required: false
        type: boolean
        default: false
      test_login_only:
        description: "Submit the first configured player ID and verify login only (no reward claims)"
        required: false
        type: boolean
        default: false
      test_claims_one_player:
        description: "Run real reward claims for the first configured player only"
        required: false
        type: boolean
        default: false
      external_primary:
        description: "Start the normal production primary full-roster run from the independent morning scheduler"
        required: false
        type: boolean
        default: false
      recover_pending_daily:
        description: "Run one guarded Daily-only recovery for the exact Player ID below; no other account or reward category"
        required: false
        type: boolean
        default: false
      daily_recovery_player_id:
        description: "Exact Player ID for recover_pending_daily; the account must already be pending for the current reset"
        required: false
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Lightweight schedule gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      scheduled_run_created_at: ${{ steps.gate.outputs.scheduled_run_created_at }}
    steps:
      - name: Check out the production scheduler policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Decide whether this trigger should proceed
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const {
              countConfiguredPlayers,
              hasCompleteFullRosterCoverage,
              isBlockingClaimJob,
              evaluateScheduledBackupFreshness,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE, '.github', 'scripts', 'primary_dispatch_policy.js'
            ));
            const isExternalPrimary = context.eventName === 'workflow_dispatch' &&
              String(context.payload.inputs?.external_primary || '').toLowerCase() === 'true';
            const launcherCron = '30 21 * * *';
            const retryCron = '0-30/5 0 * * *';
            const backupCrons = ['5 4 * * *', '5 8 * * *', '5 12 * * *', '5 16 * * *'];

            const out = (run, reason) => {
              core.setOutput('should_run', run ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.info(`${run ? 'CONTINUE' : 'SKIP'}: ${reason}`);
            };

            const selectedBranch = context.ref.replace(/^refs\/heads\//, '');
            if (selectedBranch !== 'prod') {
              out(false, `production-only claimer; selected branch '${selectedBranch}' is not 'prod'`);
              return;
            }

            if (context.eventName !== 'schedule' && !isExternalPrimary) {
              out(true, `${context.eventName} request on prod`);
              return;
            }

            if (context.eventName === 'schedule') {
              const cron = context.payload.schedule || '';
              if (![launcherCron, retryCron, ...backupCrons].includes(cron)) {
                out(false, `unrecognised schedule '${cron}'; fail closed`);
                return;
              }

              // Preserve GitHub's original event creation time; current time alone
              // cannot distinguish a delayed scheduled event from a fresh slot.
              const currentScheduleRun = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: context.runId
              });
              const scheduledRunCreatedAt = currentScheduleRun.data.created_at || '';
              core.setOutput('scheduled_run_created_at', scheduledRunCreatedAt);
              if (backupCrons.includes(cron)) {
                const freshness = evaluateScheduledBackupFreshness({
                  cron, createdAt: scheduledRunCreatedAt, now: new Date()
                });
                if (!freshness.fresh) {
                  out(false, freshness.reason + '; no browser session or reward click will start');
                  return;
                }
                core.info('Fresh backup slot accepted: created delay ' + freshness.createdDelayMinutes +
                  ' min; execution delay ' + freshness.processingDelayMinutes + ' min.');
              }

              // The daily dispatcher must pass state/duplicate checks before starting
              // its long randomized wait. It remains the backup if no external cycle ran.
              if (cron === launcherCron) {
                core.info('daily primary dispatcher; validate committed coverage and active claim jobs before waiting');
              }

              // Compute today's target in IST consistently with the Python wait/run-mode steps.
              if (cron === retryCron) {
                const istNow = new Date(Date.now() + 330 * 60 * 1000);
                const year = istNow.getUTCFullYear();
                const month = istNow.getUTCMonth();
                const day = istNow.getUTCDate();
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const offsetSeconds = parseInt(crypto.createHash('sha256').update(dateKey).digest('hex').slice(0, 8), 16) % 1501;
                const targetIstClock = Date.UTC(year, month, day, 5, 35, 0) + offsetSeconds * 1000;
                if (istNow.getTime() < targetIstClock) {
                  const target = new Date(targetIstClock);
                  out(false, `before randomized target (${String(target.getUTCHours()).padStart(2, '0')}:${String(target.getUTCMinutes()).padStart(2, '0')}:${String(target.getUTCSeconds()).padStart(2, '0')} IST)`);
                  return;
                }
              }
            } else {
              core.info('external morning primary request; check for a real competing claim job');
            }

            // If the external primary has already committed a complete full-roster cycle,
            // skip the native dispatcher before it starts its three-hour randomized wait.
            // Malformed or unavailable state fails open: the native backup remains enabled.
            if (context.eventName === 'schedule' && context.payload.schedule === launcherCron) {
              try {
                const rosterCsv = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'players.csv'), 'utf8');
                const playerCount = countConfiguredPlayers(rosterCsv);
                const metaPath = path.join(process.env.GITHUB_WORKSPACE, 'bot_meta.json');
                const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
                if (!playerCount) {
                  core.warning('Could not validate configured roster; keep native primary backup enabled.');
                } else if (hasCompleteFullRosterCoverage({
                  fullRun: meta.last_full_run,
                  playerCount,
                  now: new Date(),
                })) {
                  out(false, 'complete full-roster cycle is already recorded for today; skip redundant native dispatcher before its wait');
                  return;
                }
              } catch (error) {
                core.warning(`Could not read production coverage state during preflight (${error.message}); keep native primary backup enabled.`);
              }
            }

            // Avoid queuing duplicate claims while a previous claim job is queued/running.
            // This check applies to the daily dispatcher too: an active external claim
            // must prevent the native dispatcher from joining the concurrency queue.
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, branch: context.ref.replace(/^refs\/heads\//, ''), per_page: 100
            });
            const activeRuns = response.data.workflow_runs.filter(run =>
              String(run.id) !== String(context.runId) &&
              run.path === '.github/workflows/schedule.yml' &&
              run.head_branch === context.ref.replace(/^refs\/heads\//, '') &&
              ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)
            );

            for (const run of activeRuns) {
              const jobResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, per_page: 100
              });
              const jobs = jobResponse.data.jobs || [];
              const claimJob = jobs.find(job => job.name === 'Run Master Claimer');
              const primaryDelayJob = jobs.find(job => job.name === 'Wait for randomized primary window');
              if (isBlockingClaimJob({
                isExternalPrimary,
                claimJobStatus: claimJob?.status || '',
                primaryDelayStatus: primaryDelayJob?.status || '',
              })) {
                out(false, `claim job in run #${run.run_number} is already ${claimJob.status}`);
                return;
              }
              if (isExternalPrimary && claimJob?.status === 'queued' && primaryDelayJob?.status === 'in_progress') {
                core.info(`Allow external primary alongside run #${run.run_number}: that run is only sleeping until its randomized start window.`);
              }
            }

            out(true, 'no other queued/running claim job; proceed to state validation');

  primary_delay:
    name: Wait for randomized primary window
    needs: preflight
    if: >-
      github.ref_name == 'prod' &&
      needs.preflight.outputs.should_run == 'true' &&
      github.event_name == 'schedule' &&
      github.event.schedule == '30 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.wait.outputs.proceed }}
    steps:
      - name: Check out the production scheduler policy
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Wait for target unless another claim run takes ownership
        id: wait
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const path = require('path');
            const {
              countConfiguredPlayers,
              hasCompleteFullRosterCoverage,
              isBlockingClaimJob,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE, '.github', 'scripts', 'primary_dispatch_policy.js'
            ));
            const { owner, repo } = context.repo;
            const istNow = () => new Date(Date.now() + 330 * 60 * 1000);
            const start = istNow();
            const dateKey = `${start.getUTCFullYear()}-${String(start.getUTCMonth() + 1).padStart(2, '0')}-${String(start.getUTCDate()).padStart(2, '0')}`;
            const offsetSeconds = parseInt(crypto.createHash('sha256').update(dateKey).digest('hex').slice(0, 8), 16) % 1501;
            const targetUtcMs = Date.UTC(
              start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate(), 5, 35, 0
            ) + offsetSeconds * 1000 - 330 * 60 * 1000;

            const competingClaim = async () => {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, branch: 'prod', per_page: 100
              });
              const activeRuns = response.data.workflow_runs.filter(run =>
                String(run.id) !== String(context.runId) &&
                run.path === '.github/workflows/schedule.yml' &&
                run.head_branch === 'prod' &&
                ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)
              );
              for (const run of activeRuns) {
                const jobResponse = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: run.id, per_page: 100
                });
                const jobs = jobResponse.data.jobs || [];
                const claimJob = jobs.find(job => job.name === 'Run Master Claimer');
                const delayJob = jobs.find(job => job.name === 'Wait for randomized primary window');
                if (isBlockingClaimJob({
                  isExternalPrimary: false,
                  claimJobStatus: claimJob?.status || '',
                  primaryDelayStatus: delayJob?.status || '',
                })) {
                  return { run, claimJob };
                }
              }
              return null;
            };

            const stopForCompetitor = async () => {
              try {
                const competitor = await competingClaim();
                if (competitor) {
                  core.setOutput('proceed', 'false');
                  core.info(`SKIP: native primary wait stopped; claim job in run #${competitor.run.run_number} is already ${competitor.claimJob.status}.`);
                  return true;
                }
              } catch (error) {
                core.warning(`Could not inspect competing Actions runs (${error.message}); preserving the native backup path.`);
              }
              return false;
            };

            core.info(`Current IST: ${istNow().toISOString()}; randomized target: ${new Date(targetUtcMs).toISOString()} (UTC).`);
            while (Date.now() < targetUtcMs) {
              if (await stopForCompetitor()) return;
              const remaining = targetUtcMs - Date.now();
              await new Promise(resolve => setTimeout(resolve, Math.min(30000, remaining)));
            }

            // Recheck once after the wait to close the target-time race.
            if (await stopForCompetitor()) return;

            // If the external run completed before the randomized target, consult
            // the latest committed state rather than relying on the initial checkout.
            try {
              const [metaResponse, rosterResponse] = await Promise.all([
                github.rest.repos.getContent({ owner, repo, path: 'bot_meta.json', ref: 'prod' }),
                github.rest.repos.getContent({ owner, repo, path: 'players.csv', ref: 'prod' }),
              ]);
              if (metaResponse.data.type === 'file' && rosterResponse.data.type === 'file') {
                const meta = JSON.parse(Buffer.from(metaResponse.data.content, 'base64').toString('utf8'));
                const rosterCsv = Buffer.from(rosterResponse.data.content, 'base64').toString('utf8');
                const playerCount = countConfiguredPlayers(rosterCsv);
                if (playerCount && hasCompleteFullRosterCoverage({
                  fullRun: meta.last_full_run,
                  playerCount,
                  now: new Date(),
                })) {
                  core.setOutput('proceed', 'false');
                  core.info('SKIP: native primary wait stopped; a complete full-roster cycle is already recorded for today.');
                  return;
                }
              }
            } catch (error) {
              core.warning(`Could not refresh production coverage state after the wait (${error.message}); the in-job state gate remains authoritative.`);
            }

            core.setOutput('proceed', 'true');
            core.info('Randomized target reached; no competing claim run or completed full-roster cycle found. Proceeding with native backup.');

  run-claimer:
    name: Run Master Claimer
    needs: [preflight, primary_delay]
    if: >-
      github.ref_name == 'prod' &&
      always() &&
      needs.preflight.outputs.should_run == 'true' &&
      ((needs.primary_delay.result == 'success' && needs.primary_delay.outputs.proceed != 'false') || needs.primary_delay.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    concurrency:
      group: rewards-claimer
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Re-check reset coverage and determine run mode
        id: run_mode
        env:
          RUN_EVENT: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SCHEDULE_RUN_CREATED_AT: ${{ needs.preflight.outputs.scheduled_run_created_at }}
          DISPATCH_TYPE: ${{ github.event.action }}
          EXTERNAL_PRIMARY: ${{ inputs.external_primary }}
          MANUAL_DAILY_RECOVERY: ${{ inputs.recover_pending_daily }}
          MANUAL_DAILY_RECOVERY_PLAYER_ID: ${{ inputs.daily_recovery_player_id }}
          DIAGNOSE_LOGIN: ${{ inputs.diagnose_login }}
          LOGIN_TEST_ONLY: ${{ inputs.test_login_only }}
          CLAIM_TEST_ONLY: ${{ inputs.test_claims_one_player }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, time as dt_time, timezone
          from recovery_policy import (
              full_claim_retry_ids,
              has_complete_full_roster_coverage,
              is_recent_full_claim_recovery,
              daily_only_pending_targets,
              eligible_daily_recovery_ids,
              manual_daily_recovery_targets,
          )

          event = os.environ.get('RUN_EVENT', '')
          cron = os.environ.get('SCHEDULE_CRON', '').strip()
          dispatch_type = os.environ.get('DISPATCH_TYPE', '')
          external_primary = os.environ.get('EXTERNAL_PRIMARY', '').strip().lower() == 'true'
          manual_daily_recovery = os.environ.get('MANUAL_DAILY_RECOVERY', '').strip().lower() == 'true'
          manual_daily_player_id = os.environ.get('MANUAL_DAILY_RECOVERY_PLAYER_ID', '').strip()
          diagnose_login = os.environ.get('DIAGNOSE_LOGIN', '').strip().lower() == 'true'
          login_test_only = os.environ.get('LOGIN_TEST_ONLY', '').strip().lower() == 'true'
          claim_test_only = os.environ.get('CLAIM_TEST_ONLY', '').strip().lower() == 'true'
          selected_branch = os.environ.get('SELECTED_BRANCH', '')
          out_path = os.environ['GITHUB_OUTPUT']
          launcher_cron = '30 21 * * *'
          retry_cron = '0-30/5 0 * * *'
          backup_crons = {
              '5 4 * * *': 1,
              '5 8 * * *': 2,
              '5 12 * * *': 3,
              '5 16 * * *': 4,
          }
          ist_tz = timezone(timedelta(hours=5, minutes=30))

          def emit(execute, recovery, reason, daily_only=False):
              with open(out_path, 'a', encoding='utf-8') as handle:
                  handle.write(f"execute={'true' if execute else 'false'}\n")
                  handle.write(f"recovery={'true' if recovery else 'false'}\n")
                  handle.write(f"daily_only={'true' if daily_only else 'false'}\n")
                  handle.write(f'reason={reason}\n')
              print(f"{'RUN' if execute else 'SKIP'}: {reason}")

          def load_json(path, default):
              try:
                  with open(path, 'r', encoding='utf-8-sig') as handle:
                      return json.load(handle)
              except Exception as exc:
                  print(f'WARN: could not read {path}: {type(exc).__name__}')
                  return default

          def parse_ist(value):
              try:
                  parsed = datetime.fromisoformat(str(value))
                  if parsed.tzinfo is not None:
                      parsed = parsed.astimezone(ist_tz).replace(tzinfo=None)
                  return parsed
              except Exception:
                  return None


          def daily_target(day):
              date_key = day.strftime('%Y-%m-%d')
              offset = int(hashlib.sha256(date_key.encode('utf-8')).hexdigest()[:8], 16) % 1501
              return datetime.combine(day, dt_time(5, 35)) + timedelta(seconds=offset)

          if selected_branch != 'prod':
              emit(False, False, f"production-only claimer; selected branch '{selected_branch or 'unknown'}' is not 'prod'")
              raise SystemExit(0)

          if manual_daily_recovery and (event != 'workflow_dispatch' or external_primary):
              emit(False, False, 'manual Daily recovery is valid only as its own workflow_dispatch mode on prod; fail closed')
              raise SystemExit(0)

          if event == 'workflow_dispatch' and not external_primary:
              if manual_daily_recovery:
                  if diagnose_login or login_test_only or claim_test_only:
                      emit(False, False, 'manual Daily recovery cannot be combined with login diagnostics, login tests, or one-player claim tests')
                      raise SystemExit(0)
                  if not manual_daily_player_id:
                      emit(False, False, 'manual Daily recovery requires one exact Player ID')
                      raise SystemExit(0)

                  meta = load_json('bot_meta.json', {})
                  try:
                      with open('players.csv', 'r', newline='', encoding='utf-8-sig') as handle:
                          player_ids = [
                              (row.get('player_id') or '').strip()
                              for row in csv.DictReader(handle)
                              if (row.get('player_id') or '').strip()
                          ]
                  except Exception as exc:
                      emit(False, False, f'manual Daily recovery could not read players.csv ({type(exc).__name__}); fail closed')
                      raise SystemExit(0)
                  if not player_ids or len(player_ids) != len(set(player_ids)):
                      emit(False, False, 'manual Daily recovery rejected: configured roster is empty or contains duplicate Player IDs')
                      raise SystemExit(0)

                  now = datetime.now(ist_tz).replace(tzinfo=None)
                  reset_date = now.date()
                  if now.time() < dt_time(5, 30):
                      reset_date -= timedelta(days=1)
                  candidates = manual_daily_recovery_targets(
                      meta,
                      player_ids,
                      reset_date=reset_date.isoformat(),
                      player_id=manual_daily_player_id,
                  )
                  if manual_daily_player_id not in player_ids:
                      emit(False, False, 'manual Daily recovery rejected: requested Player ID is not in players.csv')
                  elif len(candidates) != 1 or manual_daily_player_id not in candidates:
                      emit(False, False, 'manual Daily recovery rejected: no saved, current-reset, pending Daily-only target exists for this Player ID')
                  else:
                      emit(
                          True,
                          False,
                          f'manual Daily-only recovery accepted for exactly Player ID {manual_daily_player_id}; one account, Daily reward only; no scheduled backup slot consumed',
                          True,
                      )
                  raise SystemExit(0)

              if manual_daily_player_id:
                  emit(False, False, 'daily_recovery_player_id requires recover_pending_daily=true; fail closed')
                  raise SystemExit(0)
              emit(True, False, 'manual workflow_dispatch request on prod; run the selected manual mode')
              raise SystemExit(0)

          meta = load_json('bot_meta.json', {})
          last = meta.get('last_run') or {}
          last_end = parse_ist(last.get('timestamp'))
          try:
              duration_seconds = max(0, int(last.get('duration_seconds', 0) or 0))
          except Exception:
              duration_seconds = 0
          last_start = last_end - timedelta(seconds=duration_seconds) if last_end else None

          now = datetime.now(ist_tz).replace(tzinfo=None)
          reset_date = now.date()
          if now.time() < dt_time(5, 30):
              reset_date -= timedelta(days=1)
          reset_at = datetime.combine(reset_date, dt_time(5, 30))

          if event == 'repository_dispatch':
              if dispatch_type and dispatch_type != 'claim-recovery':
                  emit(False, False, f'unsupported repository dispatch {dispatch_type!r}; fail closed')
                  raise SystemExit(0)
              retry_ids = full_claim_retry_ids(last)
              if is_recent_full_claim_recovery(
                      last, last_end=last_end, last_start=last_start, now=now, reset_at=reset_at):
                  emit(True, True, f'immediate recovery dispatch for {len(retry_ids)} unresolved player ID(s)')
              else:
                  emit(False, False, 'no eligible recent full-roster retry candidates; recovery dispatch is stale or already handled')
              raise SystemExit(0)

          if event == 'schedule' and cron not in ({launcher_cron, retry_cron} | set(backup_crons)):
              emit(False, False, f'unsupported or unrecognised scheduled event ({event!r}, {cron!r}); fail closed')
              raise SystemExit(0)
          if event != 'schedule' and not (event == 'workflow_dispatch' and external_primary):
              emit(False, False, f'unsupported or unrecognised scheduled event ({event!r}, {cron!r}); fail closed')
              raise SystemExit(0)

          # Revalidate freshness after any concurrency wait, immediately before
          # browser work. GitHub run creation time is authoritative for the slot.
          if event == 'schedule' and cron in backup_crons:
              slot_utc = {
                  '5 4 * * *': (4, 5),
                  '5 8 * * *': (8, 5),
                  '5 12 * * *': (12, 5),
                  '5 16 * * *': (16, 5),
              }[cron]
              created_raw = os.environ.get('SCHEDULE_RUN_CREATED_AT', '').strip()
              try:
                  created_at = datetime.fromisoformat(created_raw.replace('Z', '+00:00'))
                  if created_at.tzinfo is None:
                      created_at = created_at.replace(tzinfo=timezone.utc)
                  created_at = created_at.astimezone(timezone.utc)
                  scheduled_at = created_at.replace(
                      hour=slot_utc[0], minute=slot_utc[1], second=0, microsecond=0,
                  )
                  now_utc = datetime.now(timezone.utc)
                  created_delay = (created_at - scheduled_at).total_seconds()
                  execution_delay = (now_utc - scheduled_at).total_seconds()
                  max_delay = 45 * 60
                  early_tolerance = 5 * 60
                  if (
                      created_delay < -early_tolerance
                      or created_delay > max_delay
                      or execution_delay < -early_tolerance
                      or execution_delay > max_delay
                  ):
                      emit(
                          False, False,
                          f'stale backup slot {backup_crons[cron]} rejected; '
                          f'created delay {created_delay / 60:.1f} min; '
                          f'execution delay {execution_delay / 60:.1f} min; '
                          'no browser session or reward click will start',
                      )
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  emit(
                      False, False,
                      f'backup slot freshness could not be validated ({type(exc).__name__}); fail closed',
                  )
                  raise SystemExit(0)

          # Validate the configured roster before any browser work.
          try:
              with open('players.csv', 'r', newline='', encoding='utf-8-sig') as handle:
                  player_ids = [(row.get('player_id') or '').strip()
                                for row in csv.DictReader(handle)
                                if (row.get('player_id') or '').strip()]
          except Exception as exc:
              emit(False, False, f'players.csv could not be read ({type(exc).__name__}); fail closed')
              raise SystemExit(0)
          if not player_ids or len(player_ids) != len(set(player_ids)):
              emit(False, False, 'players.csv is empty or contains duplicate IDs; fail closed')
              raise SystemExit(0)

          # A recovery subset must not erase today's last full-roster coverage record.
          full = meta.get('last_full_run') or {}
          if not full and last.get('run_label') != 'Recovery Run':
              full = last
          full_end = parse_ist(full.get('timestamp'))
          try:
              full_duration = max(0, int(full.get('duration_seconds', 0) or 0))
          except Exception:
              full_duration = 0
          full_start = full_end - timedelta(seconds=full_duration) if full_end else None
          covered_since_reset = has_complete_full_roster_coverage(
              full,
              player_count=len(player_ids),
              full_end=full_end,
              full_start=full_start,
              now=now,
              reset_at=reset_at,
          )

          if event == 'workflow_dispatch' and external_primary:
              if covered_since_reset:
                  emit(False, False, 'external primary skipped: a complete full-roster cycle already started after today\'s 05:30 reset')
              else:
                  emit(True, False, 'external morning primary: no complete full-roster cycle has started after today\'s 05:30 reset')
              raise SystemExit(0)

          eligible_recent_recovery = is_recent_full_claim_recovery(
              last, last_end=last_end, last_start=last_start, now=now, reset_at=reset_at
          )

          if cron == launcher_cron:
              target = daily_target(now.date())
              if covered_since_reset:
                  emit(False, False, 'a complete roster cycle already started after today\'s 05:30 reset')
              elif now < target:
                  emit(False, False, f'launcher reached state check before randomized target {target:%H:%M:%S} IST; fail closed')
              else:
                  emit(True, False, f'run full-roster primary; randomized target was {target:%H:%M:%S} IST')

          elif cron == retry_cron:
              target = daily_target(now.date())
              if now < target:
                  emit(False, False, f'before randomized target {target:%H:%M:%S} IST; no claim before target')
              elif not covered_since_reset:
                  emit(True, False, 'fallback primary: no complete full-roster cycle has started after 05:30 IST')
              elif eligible_recent_recovery:
                  emit(True, True, f'safety-net recovery for {len(retry_ids)} unresolved ID(s) from the latest full run')
              else:
                  emit(False, False, 'post-reset full-roster cycle already ran; no eligible first recovery remains')

          elif cron in backup_crons:
              slot = backup_crons[cron]

              if now.time() < dt_time(5, 30):
                  emit(
                      False,
                      False,
                      f'delayed promotional-check slot #{slot} arrived before 05:30 IST; skipping stale event'
                  )
              else:
                  slot_label = f"Promotional Check #{slot}"
                  pending_daily = daily_only_pending_targets(
                      meta, player_ids, reset_date=reset_date.isoformat()
                  )
                  eligible_daily = eligible_daily_recovery_ids(
                      meta, player_ids,
                      reset_date=reset_date.isoformat(),
                      slot_label=slot_label,
                  )
                  if pending_daily:
                      emit(
                          True,
                          False,
                          f"backup slot #{slot}: {len(eligible_daily)} pending Daily-only account(s) will receive a saved-target recovery; "
                          f"{len(pending_daily) - len(eligible_daily)} are held by slot/cap guards; complete accounts remain promotional-only",
                          True,
                      )
                  else:
                      emit(
                          True,
                          False,
                          f"scheduled promotional check slot #{slot}; uncovered/new IDs use the full claim path"
                      )
          PY

      - name: Set up Python
        if: steps.run_mode.outputs.execute == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned dependencies
        if: steps.run_mode.outputs.execute == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Claimer
        id: claim
        if: steps.run_mode.outputs.execute == 'true'
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USERNAME: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SENDER_EMAIL }}
          SMTP_TO: ${{ secrets.RECIPIENT_EMAIL }}
          LOGIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_login }}
          LOGIN_TEST_ONLY: ${{ inputs.test_login_only }}
          CLAIM_TEST_ONLY: ${{ inputs.test_claims_one_player }}
          MANUAL_DAILY_RECOVERY: ${{ inputs.recover_pending_daily }}
          MANUAL_DAILY_RECOVERY_PLAYER_ID: ${{ inputs.daily_recovery_player_id }}
          RECOVERY_ONLY_FAILED: ${{ steps.run_mode.outputs.recovery }}
          DAILY_ONLY_RECOVERY: ${{ steps.run_mode.outputs.daily_only }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          EXTERNAL_PRIMARY: ${{ inputs.external_primary }}
        run: |
          if [[ "$MANUAL_DAILY_RECOVERY" == "true" ]]; then
            if [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] || [[ "$LOGIN_TEST_ONLY" == "true" ]] || \
               [[ "$CLAIM_TEST_ONLY" == "true" ]] || [[ "$EXTERNAL_PRIMARY" == "true" ]] || \
               [[ "$RECOVERY_ONLY_FAILED" == "true" ]] || [[ "$DAILY_ONLY_RECOVERY" != "true" ]]; then
              echo "Manual Daily recovery cannot be combined with another execution mode."
              exit 2
            elif [[ -z "$MANUAL_DAILY_RECOVERY_PLAYER_ID" ]]; then
              echo "Manual Daily recovery requires one exact Player ID."
              exit 2
            else
              python master_claimer.py
            fi
          elif [[ -n "$MANUAL_DAILY_RECOVERY_PLAYER_ID" ]]; then
            echo "daily_recovery_player_id requires recover_pending_daily=true."
            exit 2
          elif { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$LOGIN_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_TEST_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; }; then
            echo "Choose only one manual mode: diagnose_login, test_login_only, OR test_claims_one_player."
            exit 2
          elif [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]]; then
            python master_claimer.py --diagnose-login
          elif [[ "$LOGIN_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-login-only
          elif [[ "$CLAIM_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-claims-one-player
          else
            python master_claimer.py
          fi

      - name: Commit runtime state safely
        if: always() && steps.run_mode.outputs.execute == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${TARGET_BRANCH:?TARGET_BRANCH environment variable is required}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- claim_history.json bot_meta.json grenade_balance_baselines.json portal_claim_audit.json

          if git diff --cached --quiet; then
            echo "No runtime-state changes to commit."
            exit 0
          fi

          git commit -m "bot: update claim history and meta [skip ci]"
          for attempt in 1 2 3; do
            echo "State push attempt ${attempt}/3"
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              echo "Rebase conflict while saving runtime state; aborting rebase and reporting a visible failure."
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Runtime state committed to ${TARGET_BRANCH}."
              exit 0
            fi
            echo "Push failed; refreshing remote branch before the next retry."
          done
          echo "Could not save runtime state after three attempts."
          exit 1

      - name: Upload full-run report and summary
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-run-report-${{ github.run_id }}
          path: |
            debug_email.html
            daily_claim_diagnostics/
            run_artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload login diagnostics
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-login-diagnostics-${{ github.run_id }}
          path: login_diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload one-player claim test evidence
        if: always() && steps.run_mode.outputs.execute == 'true' && inputs.test_claims_one_player
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-claim-test-${{ github.run_id }}
          path: claim_test_artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Report claim execution outcome
        if: always()
        env:
          EXECUTE_REQUESTED: ${{ steps.run_mode.outputs.execute }}
          DAILY_ONLY_RECOVERY: ${{ steps.run_mode.outputs.daily_only }}
          MANUAL_DAILY_RECOVERY: ${{ inputs.recover_pending_daily }}
          MANUAL_DAILY_RECOVERY_PLAYER_ID: ${{ inputs.daily_recovery_player_id }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          DECISION_REASON: ${{ steps.run_mode.outputs.reason }}
        run: |
          {
            echo "## Claim execution"
            if [[ "$EXECUTE_REQUESTED" != "true" ]]; then
              echo "- **Claim execution:** SKIPPED"
              echo "- **Reason:** $DECISION_REASON"
            elif [[ "$CLAIM_OUTCOME" == "success" ]]; then
              echo "- **Claim execution:** STEP EXECUTED (portal confirmation is reported separately by the claimer)"
              if [[ "$DAILY_ONLY_RECOVERY" == "true" ]]; then
                if [[ "$MANUAL_DAILY_RECOVERY" == "true" ]]; then
                  echo "- **Scope:** one-account Daily-only recovery for Player ID $MANUAL_DAILY_RECOVERY_PLAYER_ID"
                  echo "- **Isolation:** no other account or reward category was eligible; scheduled backup counters were not consumed"
                else
                  echo "- **Scope:** bounded Daily-only recovery for pending account(s); complete accounts remain promotional-only"
                fi
              fi
            elif [[ "$CLAIM_OUTCOME" == "skipped" ]]; then
              echo "- **Claim execution:** SKIPPED despite an execution request"
              echo "- **Reason:** Master Claimer step did not run; inspect the run-mode gate"
            else
              echo "- **Claim execution:** FAILED OR NOT COMPLETED"
              echo "- **Step outcome:** $CLAIM_OUTCOME"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
