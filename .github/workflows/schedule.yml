name: CS Hub Rewards Claimer

on:
  schedule:
    # Dispatcher starts at 03:00 IST and sleeps until a shared randomized target between 05:35 and 06:00 IST.
    - cron: '30 21 * * *'

    # Five-minute reset-window fallbacks; these do nothing before the same randomized target.
    - cron: '0-30/5 0 * * *'

    # Four hourly promotional-check slots: 09:35, 13:35, 17:35 and 21:35 IST.
    # Uncovered/new IDs still receive the full claim path at the next backup.
    - cron: '5 4 * * *'
    - cron: '5 8 * * *'
    - cron: '5 12 * * *'
    - cron: '5 16 * * *'

  repository_dispatch:
    types: [claim-recovery]

  workflow_dispatch:
    inputs:
      diagnose_login:
        description: "Inspect login UI only (no ID submission or reward claims)"
        required: false
        type: boolean
        default: false
      test_login_only:
        description: "Submit the first configured player ID and verify login only (no reward claims)"
        required: false
        type: boolean
        default: false
      test_claims_one_player:
        description: "Run real reward claims for the first configured player only"
        required: false
        type: boolean
        default: false
      external_primary:
        description: "Start the normal production primary full-roster run from the independent morning scheduler"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Lightweight schedule gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Check out the production scheduler policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Decide whether this trigger should proceed
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const crypto = require('crypto');
            const path = require('path');
            const { isBlockingClaimJob } = require(path.join(
              process.env.GITHUB_WORKSPACE, '.github', 'scripts', 'primary_dispatch_policy.js'
            ));
            const isExternalPrimary = context.eventName === 'workflow_dispatch' &&
              String(context.payload.inputs?.external_primary || '').toLowerCase() === 'true';
            const launcherCron = '30 21 * * *';
            const retryCron = '0-30/5 0 * * *';
            const backupCrons = ['5 4 * * *', '5 8 * * *', '5 12 * * *', '5 16 * * *'];

            const out = (run, reason) => {
              core.setOutput('should_run', run ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.info(`${run ? 'CONTINUE' : 'SKIP'}: ${reason}`);
            };

            const selectedBranch = context.ref.replace(/^refs\/heads\//, '');
            if (selectedBranch !== 'prod') {
              out(false, `production-only claimer; selected branch '${selectedBranch}' is not 'prod'`);
              return;
            }

            if (context.eventName !== 'schedule' && !isExternalPrimary) {
              out(true, `${context.eventName} request on prod`);
              return;
            }

            if (context.eventName === 'schedule') {
              const cron = context.payload.schedule || '';
              if (![launcherCron, retryCron, ...backupCrons].includes(cron)) {
                out(false, `unrecognised schedule '${cron}'; fail closed`);
                return;
              }

              // Let the daily scheduled dispatcher run its wait job.
              if (cron === launcherCron) {
                out(true, 'daily primary dispatcher; wait job enforces the randomized target');
                return;
              }

              // Compute today's target in IST consistently with the Python wait/run-mode steps.
              if (cron === retryCron) {
                const istNow = new Date(Date.now() + 330 * 60 * 1000);
                const year = istNow.getUTCFullYear();
                const month = istNow.getUTCMonth();
                const day = istNow.getUTCDate();
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const offsetSeconds = parseInt(crypto.createHash('sha256').update(dateKey).digest('hex').slice(0, 8), 16) % 1501;
                const targetIstClock = Date.UTC(year, month, day, 5, 35, 0) + offsetSeconds * 1000;
                if (istNow.getTime() < targetIstClock) {
                  const target = new Date(targetIstClock);
                  out(false, `before randomized target (${String(target.getUTCHours()).padStart(2, '0')}:${String(target.getUTCMinutes()).padStart(2, '0')}:${String(target.getUTCSeconds()).padStart(2, '0')} IST)`);
                  return;
                }
              }
            } else {
              core.info('external morning primary request; check for a real competing claim job');
            }

            // Avoid queuing duplicate claims while a previous claim job is queued/running.
            // The three-hour waiting dispatcher is harmless; only its claim job matters here.
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, branch: context.ref.replace(/^refs\/heads\//, ''), per_page: 100
            });
            const activeRuns = response.data.workflow_runs.filter(run =>
              String(run.id) !== String(context.runId) &&
              run.path === '.github/workflows/schedule.yml' &&
              run.head_branch === context.ref.replace(/^refs\/heads\//, '') &&
              ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)
            );

            for (const run of activeRuns) {
              const jobResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, per_page: 100
              });
              const jobs = jobResponse.data.jobs || [];
              const claimJob = jobs.find(job => job.name === 'Run Master Claimer');
              const primaryDelayJob = jobs.find(job => job.name === 'Wait for randomized primary window');
              if (isBlockingClaimJob({
                isExternalPrimary,
                claimJobStatus: claimJob?.status || '',
                primaryDelayStatus: primaryDelayJob?.status || '',
              })) {
                out(false, `claim job in run #${run.run_number} is already ${claimJob.status}`);
                return;
              }
              if (isExternalPrimary && claimJob?.status === 'queued' && primaryDelayJob?.status === 'in_progress') {
                core.info(`Allow external primary alongside run #${run.run_number}: that run is only sleeping until its randomized start window.`);
              }
            }

            out(true, 'no other queued/running claim job; proceed to state validation');

  primary_delay:
    name: Wait for randomized primary window
    needs: preflight
    if: >-
      github.ref_name == 'prod' &&
      needs.preflight.outputs.should_run == 'true' &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '30 21 * * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.external_primary == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Sleep until today's randomized target (05:35–06:00 IST)
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          from datetime import datetime, timedelta, timezone

          ist_tz = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist_tz)
          date_key = now.strftime('%Y-%m-%d')
          offset_seconds = int(hashlib.sha256(date_key.encode('utf-8')).hexdigest()[:8], 16) % 1501
          target = now.replace(hour=5, minute=35, second=0, microsecond=0) + timedelta(seconds=offset_seconds)

          print(f'Current IST time: {now:%Y-%m-%d %H:%M:%S}')
          print(f'Shared randomized primary target: {target:%Y-%m-%d %H:%M:%S} IST')
          if now < target:
              delay = (target - now).total_seconds()
              print(f'Sleeping for {int(delay)} seconds. The claim script will not start before 05:30 IST.')
              time.sleep(delay)
          else:
              print('Launcher arrived after the target; proceeding now, never before the target.')
          PY

  run-claimer:
    name: Run Master Claimer
    needs: [preflight, primary_delay]
    if: >-
      github.ref_name == 'prod' &&
      always() &&
      needs.preflight.outputs.should_run == 'true' &&
      (needs.primary_delay.result == 'success' || needs.primary_delay.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    concurrency:
      group: rewards-claimer
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Re-check reset coverage and determine run mode
        id: run_mode
        env:
          RUN_EVENT: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_TYPE: ${{ github.event.action }}
          EXTERNAL_PRIMARY: ${{ inputs.external_primary }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, time as dt_time, timezone
          from recovery_policy import (
              full_claim_retry_ids,
              has_complete_full_roster_coverage,
              is_recent_full_claim_recovery,
          )

          event = os.environ.get('RUN_EVENT', '')
          cron = os.environ.get('SCHEDULE_CRON', '').strip()
          dispatch_type = os.environ.get('DISPATCH_TYPE', '')
          external_primary = os.environ.get('EXTERNAL_PRIMARY', '').strip().lower() == 'true'
          selected_branch = os.environ.get('SELECTED_BRANCH', '')
          out_path = os.environ['GITHUB_OUTPUT']
          launcher_cron = '30 21 * * *'
          retry_cron = '0-30/5 0 * * *'
          backup_crons = {
              '5 4 * * *': 1,
              '5 8 * * *': 2,
              '5 12 * * *': 3,
              '5 16 * * *': 4,
          }
          ist_tz = timezone(timedelta(hours=5, minutes=30))

          def emit(execute, recovery, reason):
              with open(out_path, 'a', encoding='utf-8') as handle:
                  handle.write(f"execute={'true' if execute else 'false'}\n")
                  handle.write(f"recovery={'true' if recovery else 'false'}\n")
                  handle.write(f'reason={reason}\n')
              print(f"{'RUN' if execute else 'SKIP'}: {reason}")

          def load_json(path, default):
              try:
                  with open(path, 'r', encoding='utf-8-sig') as handle:
                      return json.load(handle)
              except Exception as exc:
                  print(f'WARN: could not read {path}: {type(exc).__name__}')
                  return default

          def parse_ist(value):
              try:
                  parsed = datetime.fromisoformat(str(value))
                  if parsed.tzinfo is not None:
                      parsed = parsed.astimezone(ist_tz).replace(tzinfo=None)
                  return parsed
              except Exception:
                  return None


          def daily_target(day):
              date_key = day.strftime('%Y-%m-%d')
              offset = int(hashlib.sha256(date_key.encode('utf-8')).hexdigest()[:8], 16) % 1501
              return datetime.combine(day, dt_time(5, 35)) + timedelta(seconds=offset)

          if selected_branch != 'prod':
              emit(False, False, f"production-only claimer; selected branch '{selected_branch or 'unknown'}' is not 'prod'")
              raise SystemExit(0)

          if event == 'workflow_dispatch' and not external_primary:
              emit(True, False, 'manual workflow_dispatch request on prod; run the selected manual mode')
              raise SystemExit(0)

          meta = load_json('bot_meta.json', {})
          last = meta.get('last_run') or {}
          last_end = parse_ist(last.get('timestamp'))
          try:
              duration_seconds = max(0, int(last.get('duration_seconds', 0) or 0))
          except Exception:
              duration_seconds = 0
          last_start = last_end - timedelta(seconds=duration_seconds) if last_end else None

          now = datetime.now(ist_tz).replace(tzinfo=None)
          reset_date = now.date()
          if now.time() < dt_time(5, 30):
              reset_date -= timedelta(days=1)
          reset_at = datetime.combine(reset_date, dt_time(5, 30))

          if event == 'repository_dispatch':
              if dispatch_type and dispatch_type != 'claim-recovery':
                  emit(False, False, f'unsupported repository dispatch {dispatch_type!r}; fail closed')
                  raise SystemExit(0)
              retry_ids = full_claim_retry_ids(last)
              if is_recent_full_claim_recovery(
                      last, last_end=last_end, last_start=last_start, now=now, reset_at=reset_at):
                  emit(True, True, f'immediate recovery dispatch for {len(retry_ids)} unresolved player ID(s)')
              else:
                  emit(False, False, 'no eligible recent full-roster retry candidates; recovery dispatch is stale or already handled')
              raise SystemExit(0)

          if event == 'schedule' and cron not in ({launcher_cron, retry_cron} | set(backup_crons)):
              emit(False, False, f'unsupported or unrecognised scheduled event ({event!r}, {cron!r}); fail closed')
              raise SystemExit(0)
          if event != 'schedule' and not (event == 'workflow_dispatch' and external_primary):
              emit(False, False, f'unsupported or unrecognised scheduled event ({event!r}, {cron!r}); fail closed')
              raise SystemExit(0)

          # Validate the configured roster before any browser work.
          try:
              with open('players.csv', 'r', newline='', encoding='utf-8-sig') as handle:
                  player_ids = [(row.get('player_id') or '').strip()
                                for row in csv.DictReader(handle)
                                if (row.get('player_id') or '').strip()]
          except Exception as exc:
              emit(False, False, f'players.csv could not be read ({type(exc).__name__}); fail closed')
              raise SystemExit(0)
          if not player_ids or len(player_ids) != len(set(player_ids)):
              emit(False, False, 'players.csv is empty or contains duplicate IDs; fail closed')
              raise SystemExit(0)

          # A recovery subset must not erase today's last full-roster coverage record.
          full = meta.get('last_full_run') or {}
          if not full and last.get('run_label') != 'Recovery Run':
              full = last
          full_end = parse_ist(full.get('timestamp'))
          try:
              full_duration = max(0, int(full.get('duration_seconds', 0) or 0))
          except Exception:
              full_duration = 0
          full_start = full_end - timedelta(seconds=full_duration) if full_end else None
          covered_since_reset = has_complete_full_roster_coverage(
              full,
              player_count=len(player_ids),
              full_end=full_end,
              full_start=full_start,
              now=now,
              reset_at=reset_at,
          )

          if event == 'workflow_dispatch' and external_primary:
              if covered_since_reset:
                  emit(False, False, 'external primary skipped: a complete full-roster cycle already started after today\'s 05:30 reset')
              else:
                  emit(True, False, 'external morning primary: no complete full-roster cycle has started after today\'s 05:30 reset')
              raise SystemExit(0)

          eligible_recent_recovery = is_recent_full_claim_recovery(
              last, last_end=last_end, last_start=last_start, now=now, reset_at=reset_at
          )

          if cron == launcher_cron:
              target = daily_target(now.date())
              if covered_since_reset:
                  emit(False, False, 'a complete roster cycle already started after today\'s 05:30 reset')
              elif now < target:
                  emit(False, False, f'launcher reached state check before randomized target {target:%H:%M:%S} IST; fail closed')
              else:
                  emit(True, False, f'run full-roster primary; randomized target was {target:%H:%M:%S} IST')

          elif cron == retry_cron:
              target = daily_target(now.date())
              if now < target:
                  emit(False, False, f'before randomized target {target:%H:%M:%S} IST; no claim before target')
              elif not covered_since_reset:
                  emit(True, False, 'fallback primary: no complete full-roster cycle has started after 05:30 IST')
              elif eligible_recent_recovery:
                  emit(True, True, f'safety-net recovery for {len(retry_ids)} unresolved ID(s) from the latest full run')
              else:
                  emit(False, False, 'post-reset full-roster cycle already ran; no eligible first recovery remains')

          elif cron in backup_crons:
              slot = backup_crons[cron]

              if now.time() < dt_time(5, 30):
                  emit(
                      False,
                      False,
                      f'delayed promotional-check slot #{slot} arrived before 05:30 IST; skipping stale event'
                  )
              else:
                  emit(
                      True,
                      False,
                      f'scheduled promotional check slot #{slot}; uncovered/new IDs use the full claim path'
                  )
          PY

      - name: Set up Python
        if: steps.run_mode.outputs.execute == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned dependencies
        if: steps.run_mode.outputs.execute == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Claimer
        if: steps.run_mode.outputs.execute == 'true'
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USERNAME: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SENDER_EMAIL }}
          SMTP_TO: ${{ secrets.RECIPIENT_EMAIL }}
          LOGIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_login }}
          LOGIN_TEST_ONLY: ${{ inputs.test_login_only }}
          CLAIM_TEST_ONLY: ${{ inputs.test_claims_one_player }}
          RECOVERY_ONLY_FAILED: ${{ steps.run_mode.outputs.recovery }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          EXTERNAL_PRIMARY: ${{ inputs.external_primary }}
        run: |
          if { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$LOGIN_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_TEST_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; }; then
            echo "Choose only one manual mode: diagnose_login, test_login_only, OR test_claims_one_player."
            exit 2
          elif [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]]; then
            python master_claimer.py --diagnose-login
          elif [[ "$LOGIN_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-login-only
          elif [[ "$CLAIM_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-claims-one-player
          else
            python master_claimer.py
          fi

      - name: Commit runtime state safely
        if: always() && steps.run_mode.outputs.execute == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${TARGET_BRANCH:?TARGET_BRANCH environment variable is required}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- claim_history.json bot_meta.json

          if git diff --cached --quiet; then
            echo "No claim-history/meta changes to commit."
            exit 0
          fi

          git commit -m "bot: update claim history and meta [skip ci]"
          for attempt in 1 2 3; do
            echo "State push attempt ${attempt}/3"
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              echo "Rebase conflict while saving runtime state; aborting rebase and reporting a visible failure."
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Runtime state committed to ${TARGET_BRANCH}."
              exit 0
            fi
            echo "Push failed; refreshing remote branch before the next retry."
          done
          echo "Could not save runtime state after three attempts."
          exit 1

      - name: Upload full-run report and summary
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-run-report-${{ github.run_id }}
          path: |
            debug_email.html
            run_artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload login diagnostics
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-login-diagnostics-${{ github.run_id }}
          path: login_diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload one-player claim test evidence
        if: always() && steps.run_mode.outputs.execute == 'true' && inputs.test_claims_one_player
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-claim-test-${{ github.run_id }}
          path: claim_test_artifacts/
          if-no-files-found: warn
          retention-days: 14
