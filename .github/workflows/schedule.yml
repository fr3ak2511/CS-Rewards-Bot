name: CS Hub Rewards Claimer

on:
  schedule:
    # Primary daily run: 05:35 IST (00:05 UTC).
    - cron: '5 0 * * *'

    # Morning delivery retries: every 5 minutes after 05:35 IST.
    # These continue through 13:25 IST to tolerate delayed/dropped schedule events.
    # 09:35 IST is deliberately omitted from this retry expression because it is
    # already a four-hour backup trigger below.
    - cron: '10-59/5 0 * * *'
    - cron: '*/5 1-3 * * *'
    - cron: '0,10-59/5 4 * * *'
    - cron: '*/5 5-7 * * *'

    # Backup checks every 4 hours from the primary slot:
    # 09:35, 13:35, 17:35, 21:35, and 01:35 IST.
    - cron: '5 4,8,12,16,20 * * *'

  repository_dispatch:
    types: [claim-recovery]

  workflow_dispatch:
    inputs:
      diagnose_login:
        description: "Inspect login UI only (no ID submission or reward claims)"
        required: false
        type: boolean
        default: false
      test_login_only:
        description: "Submit the first configured player ID and verify login only (no reward claims)"
        required: false
        type: boolean
        default: false
      test_claims_one_player:
        description: "Run real reward claims for the first configured player only"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Lightweight schedule gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Skip scheduled checks while a claim job is queued or running
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const out = (run, reason) => {
              core.setOutput('should_run', run ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.info(`${run ? 'CONTINUE' : 'SKIP'}: ${reason}`);
            };

            // Manual requests are intentional; preserve existing manual modes.
            if (context.eventName !== 'schedule') {
              out(true, 'manual workflow_dispatch request');
              return;
            }

            // The main claimer job has its own concurrency group. Preflight jobs
            // can still run while it is busy and cheaply suppress retry triggers.
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: 'main',
              per_page: 100
            });

            const activeRuns = response.data.workflow_runs.filter(run =>
              String(run.id) !== String(context.runId) &&
              run.path === '.github/workflows/schedule.yml' &&
              ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)
            );

            for (const run of activeRuns) {
              const jobResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              const claimJob = jobResponse.data.jobs.find(job => job.name === 'run-claimer');
              if (claimJob && ['queued', 'in_progress'].includes(claimJob.status)) {
                out(false, `claim job #${run.run_number} is already ${claimJob.status}`);
                return;
              }
            }

            out(true, 'no other claim job is queued or running; evaluate current claim state');

  run-claimer:
    name: Run Master Claimer
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    concurrency:
      group: rewards-claimer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Re-check state before starting the browser job
        id: run_mode
        env:
          RUN_EVENT: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from datetime import datetime, timedelta, timezone

          event = os.environ.get("RUN_EVENT", "")
          cron = os.environ.get("SCHEDULE_CRON", "")
          out_path = os.environ["GITHUB_OUTPUT"]

          def emit(execute, recovery, reason):
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write(f"execute={'true' if execute else 'false'}\n")
                  f.write(f"recovery={'true' if recovery else 'false'}\n")
                  f.write(f"reason={reason}\n")
              print(f"{'RUN' if execute else 'SKIP'}: {reason}")

          # Preserve the established manual diagnostic/test controls.
          if event == "workflow_dispatch":
              emit(True, False, "manual workflow_dispatch request")
              raise SystemExit(0)

          # Event-driven recovery is requested by recovery.yml only after a
          # completed scheduled full run has recorded hard-failed player IDs.
          # Re-validate the state after acquiring the claim-job concurrency slot
          # so duplicate/late dispatches cannot run a second recovery.
          if event == "repository_dispatch":
              try:
                  with open("bot_meta.json", "r", encoding="utf-8-sig") as f:
                      dispatch_meta = json.load(f)
              except Exception:
                  dispatch_meta = {}
              prior = dispatch_meta.get("last_run") or {}
              prior_ids = prior.get("failed_player_ids")
              if not isinstance(prior_ids, list):
                  prior_ids = []
              prior_ids = [str(pid).strip() for pid in prior_ids if str(pid).strip()]
              age_hours = None
              try:
                  parsed = datetime.fromisoformat(str(prior.get("timestamp")))
                  if parsed.tzinfo is not None:
                      parsed = parsed.astimezone(timezone(timedelta(hours=5, minutes=30))).replace(tzinfo=None)
                  current_ist = datetime.utcnow() + timedelta(hours=5, minutes=30)
                  age_hours = (current_ist - parsed).total_seconds() / 3600
              except Exception:
                  pass
              if prior.get("run_label") == "Primary Run" and prior_ids and age_hours is not None and 0 <= age_hours <= 4:
                  emit(True, True, f"event-driven recovery for {len(prior_ids)} failed ID(s) from the recent primary run")
              else:
                  emit(False, False, "no eligible recent Primary Run failures remain; recovery dispatch is stale or already handled")
              raise SystemExit(0)

          if event != "schedule":
              emit(False, False, "unsupported event; fail closed")
              raise SystemExit(0)

          primary_cron = "5 0 * * *"
          retry_crons = {
              "10-59/5 0 * * *",
              "*/5 1-3 * * *",
              "0,10-59/5 4 * * *",
              "*/5 5-7 * * *",
          }
          backup_cron = "5 4,8,12,16,20 * * *"

          if cron != primary_cron and cron not in retry_crons and cron != backup_cron:
              emit(False, False, "unrecognised schedule expression; fail closed")
              raise SystemExit(0)

          def load_json(path, default):
              try:
                  with open(path, "r", encoding="utf-8-sig") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARN: could not read {path}: {type(exc).__name__}")
                  return default

          meta = load_json("bot_meta.json", {})
          history = load_json("claim_history.json", {})
          try:
              with open("players.csv", "r", newline="", encoding="utf-8-sig") as f:
                  players = [
                      (row.get("player_id") or "").strip()
                      for row in csv.DictReader(f)
                      if (row.get("player_id") or "").strip()
                  ]
          except Exception as exc:
              emit(False, False, f"players.csv could not be read ({type(exc).__name__}); fail closed")
              raise SystemExit(0)

          if not players or len(players) != len(set(players)):
              emit(False, False, "players.csv is empty or contains duplicate IDs; fail closed")
              raise SystemExit(0)

          now_ist = datetime.utcnow() + timedelta(hours=5, minutes=30)
          now_text = now_ist.strftime("%Y-%m-%dT%H:%M:%S")
          reset_date = now_ist.date()
          if now_ist.time() < datetime.strptime("05:30:00", "%H:%M:%S").time():
              reset_date = (now_ist - timedelta(days=1)).date()
          reset_text = f"{reset_date.isoformat()}T05:30:00"

          last = meta.get("last_run") or {}
          last_text = str(last.get("timestamp") or "")[:19]
          run_label = last.get("run_label", "")
          valid_run_labels = {"Primary Run", "Manual Run", "Morning Recovery"}
          completed_since_reset = (
              bool(last_text)
              and reset_text <= last_text <= now_text
              and run_label in valid_run_labels
          )

          failed_ids = last.get("failed_player_ids")
          if not isinstance(failed_ids, list):
              failed_ids = []
          failed_ids = list(dict.fromkeys(str(pid).strip() for pid in failed_ids if str(pid).strip()))
          failed_count = max(int(last.get("failed_player_count", 0) or 0), len(failed_ids))

          age_hours = None
          if last_text:
              try:
                  parsed = datetime.fromisoformat(str(last.get("timestamp")))
                  if parsed.tzinfo is not None:
                      parsed = parsed.astimezone(timezone(timedelta(hours=5, minutes=30))).replace(tzinfo=None)
                  age_hours = (now_ist - parsed).total_seconds() / 3600
              except Exception:
                  pass
          primary_recent = age_hours is not None and 0 <= age_hours <= 4

          def observed_since_reset(record):
              if not isinstance(record, dict):
                  return False
              claim = str(record.get("last_claim") or "")[:19]
              if claim and reset_text <= claim <= now_text:
                  return True
              if record.get("status") == "portal_claimed":
                  observed = str(record.get("portal_observed_at") or "")[:19]
                  if observed and reset_text <= observed <= now_text:
                      return True
              return False

          ids_seen = set(meta.get("new_ids_seen", []))
          new_ids = [pid for pid in players if pid not in history or pid not in ids_seen]
          missing_claims = []
          for pid in players:
              player_history = history.get(pid, {}) if isinstance(history, dict) else {}
              if not observed_since_reset(player_history.get("daily", {})):
                  missing_claims.append(pid)
                  continue
              store = player_history.get("store", {})
              if any(not observed_since_reset(store.get(f"reward_{i}", {})) for i in (1, 2, 3)):
                  missing_claims.append(pid)

          # Morning retry window: if no full run has completed since the daily reset,
          # any retry can become the fallback primary. Once a run completes, retries
          # only launch an immediate failed-ID recovery; otherwise they stop.
          if cron == primary_cron or cron in retry_crons:
              if not completed_since_reset:
                  emit(True, False, "no full run completed since the 05:30 IST reset; run primary/fallback")
              elif failed_count:
                  if run_label == "Primary Run" and failed_ids and primary_recent:
                      emit(True, True, f"retrying {len(failed_ids)} failed ID(s) recorded by the recent primary run")
                  elif run_label == "Morning Recovery":
                      emit(False, False, "recovery already ran; defer any remaining gaps to the next 4-hour backup")
                  else:
                      emit(True, False, "failures recorded, but existing recovery constraints require a safe full-roster fallback")
              else:
                  emit(False, False, "a run has completed with no recorded hard failures; wait for the 4-hour backup")

          # Four-hour backups are real roster checks. The existing claimer's
          # history/cooldown logic prevents repeating rewards already recorded.
          # If the last full run has recent hard failures, prefer the smaller
          # failed-ID recovery instead of another full-roster pass.
          elif cron == backup_cron:
              if failed_count and run_label == "Primary Run" and failed_ids and primary_recent:
                  emit(True, True, f"backup is recovering {len(failed_ids)} failed ID(s) from the recent primary run")
              elif not completed_since_reset:
                  emit(True, False, "no full run completed since the current daily reset; run fallback")
              else:
                  emit(True, False, f"scheduled 4-hour backup: checking {len(new_ids)} new/untracked ID(s) and {len(missing_claims)} player(s) with missing daily claims")
          PY

      - name: Set up Python
        if: steps.run_mode.outputs.execute == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned dependencies
        if: steps.run_mode.outputs.execute == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Claimer
        if: steps.run_mode.outputs.execute == 'true'
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USERNAME: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SENDER_EMAIL }}
          SMTP_TO: ${{ secrets.RECIPIENT_EMAIL }}
          LOGIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_login }}
          LOGIN_TEST_ONLY: ${{ inputs.test_login_only }}
          CLAIM_TEST_ONLY: ${{ inputs.test_claims_one_player }}
          RECOVERY_ONLY_FAILED: ${{ steps.run_mode.outputs.recovery }}
        run: |
          if { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$LOGIN_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; } \
            || { [[ "$LOGIN_TEST_ONLY" == "true" ]] && [[ "$CLAIM_TEST_ONLY" == "true" ]]; }; then
            echo "Choose only one manual mode: diagnose_login, test_login_only, OR test_claims_one_player."
            exit 2
          elif [[ "$LOGIN_DIAGNOSTIC_ONLY" == "true" ]]; then
            python master_claimer.py --diagnose-login
          elif [[ "$LOGIN_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-login-only
          elif [[ "$CLAIM_TEST_ONLY" == "true" ]]; then
            python master_claimer.py --test-claims-one-player
          else
            python master_claimer.py
          fi

      - name: Commit runtime state
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: update claim history and meta [skip ci]"
          file_pattern: "claim_history.json bot_meta.json"

      - name: Upload full-run report and summary
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-run-report-${{ github.run_id }}
          path: |
            debug_email.html
            run_artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload login diagnostics
        if: always() && steps.run_mode.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-login-diagnostics-${{ github.run_id }}
          path: login_diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload one-player claim test evidence
        if: always() && steps.run_mode.outputs.execute == 'true' && inputs.test_claims_one_player
        uses: actions/upload-artifact@v4
        with:
          name: cs-hub-claim-test-${{ github.run_id }}
          path: claim_test_artifacts/
          if-no-files-found: warn
          retention-days: 14
